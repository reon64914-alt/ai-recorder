<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🎥 録画ツール</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f9; text-align: center; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        button { padding: 12px 25px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; color: white; font-weight: bold; transition: 0.3s;}
        #startBtn { background-color: #2e7d32; }
        #startBtn:hover { background-color: #1b5e20; }
        #stopBtn { background-color: #d32f2f; }
        #stopBtn:disabled { background-color: #cccccc; cursor: not-allowed; }
        #cameraView { width: 100%; max-height: 300px; border-radius: 10px; background-color: #000; margin-top: 15px; object-fit: cover; }
        .note { font-size: 13px; color: #666; background: #fff3e0; padding: 10px; border-radius: 5px; border-left: 4px solid #ff9800; text-align: left; margin-top: 20px;}
        #errorLog { color: #d32f2f; font-size: 14px; margin-top: 15px; text-align: left; background: #ffebee; padding: 15px; border-radius: 5px; display: none; white-space: pre-wrap;}
        #mixCanvas { display: none; }
        
        /* ★追加：レイアウト選択のデザイン */
        .layout-selector { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; display: inline-block; width: 100%; box-sizing: border-box; border: 2px solid #bbdefb;}
        .layout-selector h4 { margin-top: 0; margin-bottom: 10px; color: #1565c0; }
        .layout-selector label { display: block; margin-bottom: 8px; font-weight: bold; cursor: pointer; font-size: 15px;}
        .layout-selector input[type="radio"] { transform: scale(1.2); margin-right: 8px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 AI面接 録画ツール</h2>
        <p>面接の振り返りに最適なレイアウトで記録します。</p>
        
        <div class="layout-selector">
            <h4>📺 録画レイアウトの選択</h4>
            <label><input type="radio" name="layout" value="faceMain" checked> 👤 あなたの顔をメイン (右上に小さく面接画面)</label>
            <label><input type="radio" name="layout" value="screenMain"> 💻 面接画面をメイン (右上に小さくあなたの顔)</label>
            <label><input type="radio" name="layout" value="screenOnly"> 🖥️ 画面のみ (顔は録画せず、画面と声だけ記録)</label>
        </div>

        <button id="startBtn">🔴 録画スタート</button>
        <button id="stopBtn" disabled>⏹️ 録画ストップ＆保存</button>
        
        <div id="errorLog"></div>

        <div class="note">
            <b>【⚠️ 録画時のコツ】</b><br>
            録画スタートを押したら<b>「Chromeタブ」</b>から面接システムを選び、必ず<b>「タブの音声を共有」にチェック</b>を入れてください。<br>
            ※録画中もレイアウトボタンを押せば、リアルタイムで配置が切り替わります！
        </div>
        
        <h3 style="margin-top: 30px;">👤 あなたのカメラ映像</h3>
        <video id="cameraView" autoplay muted playsinline></video>
        
        <canvas id="mixCanvas" width="1280" height="720"></canvas>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let combinedStream;
        let animationId;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const cameraView = document.getElementById('cameraView');
        const errorLog = document.getElementById('errorLog');
        
        const canvas = document.getElementById('mixCanvas');
        const ctx = canvas.getContext('2d');
        const screenVideo = document.createElement('video');
        screenVideo.muted = true;
        screenVideo.playsInline = true;

        function showError(msg, err) {
            console.error(msg, err);
            errorLog.style.display = "block";
            errorLog.innerHTML = `<b>❌ エラーが発生しました</b><br>${msg}<br><br><span style="font-size:12px; color:#555;">${err ? err.message : ""}</span>`;
        }

        // ★修正：枠線（ボーダー）を描くかどうかを選べるようにしました
        function drawVideoFit(vid, ctx, x, y, w, h, drawBorder = true) {
            if (vid.readyState < 2) return;
            const vidRatio = vid.videoWidth / vid.videoHeight;
            const boxRatio = w / h;
            let drawW, drawH, drawX, drawY;
            
            if (vidRatio > boxRatio) {
                drawW = w; drawH = w / vidRatio;
                drawX = x; drawY = y + (h - drawH) / 2;
            } else {
                drawH = h; drawW = h * vidRatio;
                drawX = x + (w - drawW) / 2; drawY = y;
            }
            ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            
            if (drawBorder) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            }
        }

        // 情報テキストを描画する関数
        function drawInfoText(ctx, x, y, hasShadow = false) {
            ctx.save();
            if (hasShadow) {
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
            }
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText('🔴 REC', x, y);
            ctx.font = '18px sans-serif';
            ctx.fillText(new Date().toLocaleString('ja-JP'), x, y + 40);
            ctx.fillText('AI面接 振り返り記録', x, y + 70);
            ctx.restore();
        }

        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true }).then(camStream => {
            cameraView.srcObject = camStream;
            window.camStream = camStream; 
        }).catch(err => {
            showError("カメラとマイクへのアクセスが拒否されました。", err);
        });

        startBtn.onclick = async () => {
            errorLog.style.display = "none";
            
            try {
                const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });

                screenVideo.srcObject = displayStream;
                await screenVideo.play();

                function drawFrame() {
                    // 背景をリセット
                    ctx.fillStyle = '#1E293B'; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // ★現在選ばれているラジオボタンの値を取得
                    const currentLayout = document.querySelector('input[name="layout"]:checked').value;

                    if (currentLayout === 'faceMain') {
                        // パターン1：顔メイン
                        drawVideoFit(cameraView, ctx, 20, 20, 880, 680);
                        drawVideoFit(screenVideo, ctx, 920, 20, 340, 255);
                        drawInfoText(ctx, 920, 310);
                        
                    } else if (currentLayout === 'screenMain') {
                        // パターン2：画面メイン（逆にする）
                        drawVideoFit(screenVideo, ctx, 20, 20, 880, 680);
                        drawVideoFit(cameraView, ctx, 920, 20, 340, 255);
                        drawInfoText(ctx, 920, 310);
                        
                    } else if (currentLayout === 'screenOnly') {
                        // パターン3：画面のみ（全画面）
                        drawVideoFit(screenVideo, ctx, 0, 0, 1280, 720, false);
                        // 背景が白っぽくても文字が見えるように影（シャドウ）をつける
                        drawInfoText(ctx, 1030, 50, true); 
                    }
                }

                animationId = setInterval(drawFrame, 33);

                const canvasStream = canvas.captureStream(30);

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const dest = audioCtx.createMediaStreamDestination();

                // ※「画面のみ」を選んでいても、マイクの音声はしっかり録音されます
                if (window.camStream && window.camStream.getAudioTracks().length > 0) {
                    audioCtx.createMediaStreamSource(window.camStream).connect(dest);
                }
                if (displayStream.getAudioTracks().length > 0) {
                    audioCtx.createMediaStreamSource(displayStream).connect(dest);
                }

                const tracks = [
                    ...canvasStream.getVideoTracks(),
                    ...dest.stream.getAudioTracks()
                ];
                combinedStream = new MediaStream(tracks);

                const options = { videoBitsPerSecond: 2500000 };
                mediaRecorder = new MediaRecorder(combinedStream, options);
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    document.body.appendChild(a);
                    a.style = 'display: none';
                    a.href = url;
                    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
                    a.download = 'AI面接録画_' + dateStr + '.webm';
                    a.click();
                    window.URL.revokeObjectURL(url);
                    recordedChunks = [];
                    displayStream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                startBtn.innerText = "⏺ 録画中...";

                displayStream.getVideoTracks()[0].onended = () => {
                    if(mediaRecorder.state !== 'inactive') stopBtn.click();
                };

            } catch (err) {
                showError("録画を開始できませんでした。画面共有をキャンセルしたか、タブを選択していない可能性があります。", err);
            }
        };

        stopBtn.onclick = () => {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            clearInterval(animationId);
            screenVideo.srcObject = null;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            startBtn.innerText = "🔴 録画スタート";
        };
    </script>
</body>
</html>
